server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # index.html: nunca cachear — siempre debe reflejar los hashes del build actual
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Assets con hash (vite genera nombres únicos) → cache largo e inmutable
    location ~* /assets/.*\.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Otros estáticos sin hash
    location ~* \.(png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA: todo lo demás → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
